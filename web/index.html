<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Issuer Intelligence Hub</title>
<meta name="description" content="How your share trades on Xetra, and what every announcement did to it.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("iih.theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="sp">
    <svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="currentColor"/><path d="M12 39h11l5-19 7 27 5-15h12" fill="none" stroke="var(--bg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
    <div class="sp-name">Issuer Intelligence</div>
    <div class="sp-msg" id="spmsg">Reading Xetra data…</div>
  </div>
</div>

<header class="nav">
  <div class="nav-in">
    <button class="brand" data-go="overview" aria-label="Overview">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="currentColor"/><path d="M12 39h11l5-19 7 27 5-15h12" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Issuer Intelligence</span>
    </button>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="nav-r"><button class="theme-btn" id="theme" type="button" aria-label="Dark mode"></button><div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
      <button class="co" id="co" data-act="pal" aria-label="Switch company"></button>
      <button class="ask-btn" data-act="ask" aria-label="Ask the analyst"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="currentColor"/></svg><span>Ask</span></button>
    </div>
  </div>
</header>

<main id="main"></main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="scrim" id="scrim" data-act="close"></div>
<aside class="sheet" id="sheet" aria-label="IR analyst" aria-hidden="true">
  <div class="sh-head"><div><b id="shtitle">IR Analyst</b><small id="shctx"></small></div><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="log" id="log"></div>
  <div class="sugg" id="sugg"></div>
  <form class="compose" id="compose" autocomplete="off"><input id="q" aria-label="Question" maxlength="1000"><button aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
</aside>
<div class="pal" id="pal" role="dialog" aria-label="Search"><input id="palq" placeholder="Search companies and actions" aria-label="Search"><ul id="pall" role="listbox"></ul></div>
<div id="progress" aria-hidden="true"><i></i></div>
<div id="tip"></div>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
